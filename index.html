<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PS4 WebKit Launcher</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010611;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    user-select:none;
}

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(20,90,180,.30),
            transparent 42%
        ),
        radial-gradient(
            ellipse at 50% 100%,
            rgba(0,80,180,.18),
            transparent 55%
        ),
        linear-gradient(
            180deg,
            #020914 0%,
            #01040b 100%
        );
}

.bg:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.018) 0,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 4px
        );
    pointer-events:none;
}

.horizon{
    position:absolute;
    left:0;
    right:0;
    top:54%;
    height:2px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(30,120,255,.1),
            rgba(90,190,255,.8),
            rgba(30,120,255,.1),
            transparent
        );
    box-shadow:0 0 30px rgba(40,140,255,.55);
}

.wave{
    position:absolute;
    left:-20%;
    width:140%;
    height:170px;
    border-radius:50%;
    border-top:1px solid rgba(50,140,255,.14);
}

.wave:nth-child(1){
    top:35%;
    transform:rotate(-3deg);
}

.wave:nth-child(2){
    top:44%;
    transform:rotate(2deg);
    opacity:.7;
}

.wave:nth-child(3){
    top:58%;
    transform:rotate(-2deg);
    opacity:.45;
}

.wave:nth-child(4){
    top:70%;
    transform:rotate(3deg);
    opacity:.3;
}

.ram-field{
    position:absolute;
    left:50%;
    bottom:-20px;
    width:100%;
    height:58%;
    transform:translateX(-50%);
    perspective:1100px;
    perspective-origin:50% 75%;
    transform-style:preserve-3d;
    pointer-events:none;
    overflow:visible;
    z-index:3;
}

.ram-block{
    position:absolute;
    bottom:0;

    width:58px;

    background:
        linear-gradient(
            90deg,
            rgba(20,100,210,.025),
            rgba(80,175,255,.15),
            rgba(20,90,200,.025)
        );

    border:1px solid rgba(90,185,255,.27);

    transform-style:preserve-3d;

    box-shadow:
        0 0 20px rgba(30,130,255,.10),
        inset 0 0 20px rgba(80,180,255,.06);

    backdrop-filter:blur(2px);
}

.ram-block:before{
    content:"";

    position:absolute;

    left:-1px;
    top:-20px;

    width:58px;
    height:20px;

    background:
        linear-gradient(
            135deg,
            rgba(130,215,255,.20),
            rgba(40,120,255,.06)
        );

    border:1px solid rgba(105,200,255,.30);

    transform-origin:bottom center;

    transform:skewX(-30deg);
}

.ram-block:after{
    content:"";

    position:absolute;

    right:-20px;
    top:-20px;

    width:20px;
    height:calc(100% + 20px);

    background:
        linear-gradient(
            180deg,
            rgba(40,130,230,.10),
            rgba(10,55,150,.025)
        );

    border-right:1px solid rgba(80,170,255,.20);

    transform-origin:left center;

    transform:skewY(-30deg);
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#5eb4ff;
    box-shadow:0 0 8px #278cff;
    opacity:.55;
    z-index:4;
}

.p1{left:8%;top:27%}
.p2{left:21%;top:43%}
.p3{left:33%;top:22%}
.p4{left:67%;top:25%}
.p5{left:81%;top:42%}
.p6{left:91%;top:31%}
.p7{left:15%;top:69%}
.p8{left:75%;top:68%}
.p9{left:58%;top:18%}

.credit{
    position:absolute;
    top:13px;
    left:50%;
    transform:translateX(-50%);
    font-size:9px;
    letter-spacing:5px;
    color:rgba(190,210,235,.55);
    z-index:30;
}

.creator{
    position:absolute;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    font-size:21px;
    font-weight:bold;
    letter-spacing:6px;
    color:#dcecff;
    text-shadow:
        0 0 8px #479cff,
        0 0 20px rgba(30,120,255,.7);
    z-index:30;
}

.title{
    position:absolute;
    top:67px;
    width:100%;
    text-align:center;
    font-size:40px;
    font-weight:800;
    letter-spacing:5px;
    color:#dcecff;
    text-shadow:
        0 0 5px white,
        0 0 18px #459bff,
        0 0 35px rgba(30,110,255,.7);
    z-index:30;
}

.subtitle{
    position:absolute;
    top:123px;
    width:100%;
    text-align:center;
    font-size:9px;
    letter-spacing:5px;
    color:rgba(205,220,240,.55);
    z-index:30;
}

.hands{
    position:absolute;
    left:50%;
    top:53%;
    width:650px;
    height:330px;
    transform:translate(-50%,-50%);
    z-index:20;
}

.hand{
    position:absolute;
    top:50px;
    width:250px;
    height:230px;
    transform-style:preserve-3d;
}

.hand.left{
    left:10px;
}

.hand.right{
    right:10px;
}

.palm{
    position:absolute;
    left:50%;
    top:78px;
    width:145px;
    height:112px;
    transform:translateX(-50%);

    background:
        linear-gradient(
            135deg,
            #74472f,
            #ad7047 45%,
            #603a28
        );

    clip-path:polygon(
        12% 20%,
        28% 8%,
        72% 8%,
        88% 20%,
        100% 50%,
        92% 83%,
        70% 100%,
        30% 100%,
        8% 83%,
        0 50%
    );

    box-shadow:
        inset 10px 7px 8px rgba(255,190,130,.12),
        inset -14px -12px 18px rgba(0,0,0,.35);
}

.finger{
    position:absolute;
    top:0;
    width:38px;
    height:105px;
    border-radius:22px;

    background:
        linear-gradient(
            90deg,
            #653d29,
            #b27349 45%,
            #6b4029
        );

    box-shadow:
        inset 5px 0 5px rgba(255,190,130,.10),
        inset -6px 0 7px rgba(0,0,0,.25);

    transform-origin:bottom center;
    z-index:4;
}

.hand.left .f1{
    left:18px;
    transform:rotate(-38deg);
}

.hand.left .f2{
    left:52px;
    transform:rotate(-20deg);
}

.hand.left .f3{
    left:87px;
    transform:rotate(0deg);
}

.hand.left .f4{
    left:122px;
    transform:rotate(20deg);
}

.hand.right .f1{
    right:18px;
    transform:rotate(38deg);
}

.hand.right .f2{
    right:52px;
    transform:rotate(20deg);
}

.hand.right .f3{
    right:87px;
    transform:rotate(0deg);
}

.hand.right .f4{
    right:122px;
    transform:rotate(-20deg);
}

.thumb{
    position:absolute;
    top:75px;
    width:58px;
    height:88px;
    border-radius:32px;

    background:
        linear-gradient(
            90deg,
            #653d28,
            #aa6c45,
            #633b27
        );

    z-index:7;
}

.hand.left .thumb{
    left:8px;
    transform:rotate(-48deg);
}

.hand.right .thumb{
    right:8px;
    transform:rotate(48deg);
}

.pill{
    position:absolute;
    left:50%;
    top:101px;
    width:128px;
    height:53px;

    transform:translateX(-50%) rotate(-7deg);

    border-radius:60px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:10px;
    font-weight:bold;
    letter-spacing:3px;

    cursor:pointer;
    z-index:12;

    transition:
        transform .2s,
        filter .2s;
}

.pill.red{
    background:
        linear-gradient(
            135deg,
            #ff4646,
            #bc0808 55%,
            #570000
        );

    border:2px solid rgba(255,230,230,.95);

    box-shadow:
        0 0 18px rgba(255,20,20,.65),
        inset 0 7px 10px rgba(255,255,255,.23);
}

.pill.blue{
    background:
        linear-gradient(
            135deg,
            #4bb0ff,
            #0873dc 55%,
            #003b86
        );

    border:2px solid rgba(225,245,255,.95);

    box-shadow:
        0 0 18px rgba(20,130,255,.7),
        inset 0 7px 10px rgba(255,255,255,.23);

    transform:translateX(-50%) rotate(7deg);
}

.pill:hover{
    filter:brightness(1.25);
    transform:translateX(-50%) scale(1.08) rotate(-7deg);
}

.hand.right .pill:hover{
    transform:translateX(-50%) scale(1.08) rotate(7deg);
}

.option{
    position:absolute;
    top:375px;
    width:210px;
    text-align:center;
    z-index:30;
}

.option.left{
    left:0;
}

.option.right{
    right:0;
}

.option-title{
    font-size:16px;
    font-weight:bold;
    letter-spacing:5px;
}

.option.left .option-title{
    color:#ff3b3b;
    text-shadow:0 0 12px rgba(255,0,0,.65);
}

.option.right .option-title{
    color:#319dff;
    text-shadow:0 0 12px rgba(0,120,255,.65);
}

.option-sub{
    margin-top:8px;
    font-size:8px;
    letter-spacing:4px;
    color:rgba(190,205,225,.55);
}

.controls{
    position:absolute;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    z-index:40;
    font-size:9px;
    letter-spacing:4px;
    color:rgba(190,210,235,.6);
    white-space:nowrap;
}

.vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;

    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,.55) 100%
        );
}

.crt{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:51;
    opacity:.18;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.035) 4px
        );
}

.boot{
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:opacity 1s;
}

.boot-logo{
    font-size:35px;
    letter-spacing:12px;
    color:white;
    text-shadow:0 0 20px #278cff;
}

.boot-text{
    margin-top:15px;
    font-size:9px;
    letter-spacing:5px;
    color:#7199c7;
}

.boot-bar{
    margin-top:25px;
    width:180px;
    height:2px;
    background:#152337;
    overflow:hidden;
}

.boot-progress{
    width:0;
    height:100%;
    background:#5baeff;
    box-shadow:0 0 10px #5baeff;
    animation:bootLoad 2.1s forwards;
}

@keyframes bootLoad{
    to{
        width:100%;
    }
}

@media(max-width:800px){

    .title{
        font-size:27px;
        letter-spacing:3px;
    }

    .hands{
        transform:translate(-50%,-50%) scale(.78);
    }

    .creator{
        font-size:17px;
    }
}

@media(max-height:650px){

    .hands{
        transform:translate(-50%,-50%) scale(.68);
    }

    .controls{
        bottom:8px;
    }
}
</style>
</head>

<body>

<div class="bg">

    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>

    <div class="horizon"></div>

    <div class="ram-field"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>
    <div class="particle p9"></div>

</div>

<div class="credit">
    CREATED FOR THE COMMUNITY
</div>

<div class="creator">
    Raw13G
</div>

<div class="title">
    PS4 WEBKIT LAUNCHER
</div>

<div class="subtitle">
    SELECT YOUR PATH
</div>

<div class="hands">

    <div class="hand left">

        <div class="finger f1"></div>
        <div class="finger f2"></div>
        <div class="finger f3"></div>
        <div class="finger f4"></div>

        <div class="palm"></div>

        <div class="thumb"></div>

        <div class="pill red" id="closeBtn">
            CLOSE
        </div>

    </div>

    <div class="hand right">

        <div class="finger f1"></div>
        <div class="finger f2"></div>
        <div class="finger f3"></div>
        <div class="finger f4"></div>

        <div class="palm"></div>

        <div class="thumb"></div>

        <div class="pill blue" id="continueBtn">
            CONTINUE
        </div>

    </div>

    <div class="option left">

        <div class="option-title">
            CLOSE
        </div>

        <div class="option-sub">
            EXIT PAGE
        </div>

    </div>

    <div class="option right">

        <div class="option-title">
            CONTINUE
        </div>

        <div class="option-sub">
            OPEN RAW13G
        </div>

    </div>

</div>

<div class="controls">
    ← → SELECT &nbsp;&nbsp;&nbsp;&nbsp; ENTER / X CONFIRM
</div>

<div class="vignette"></div>

<div class="crt"></div>

<div class="boot" id="boot">

    <div class="boot-logo">
        PS4
    </div>

    <div class="boot-text">
        WEBKIT LAUNCHER
    </div>

    <div class="boot-bar">
        <div class="boot-progress"></div>
    </div>

</div>

<script>

const TARGET="https://raw13g.github.io/";

const ramField=
    document.querySelector(".ram-field");

const total=31;

for(let i=0;i<total;i++){

    const block=
        document.createElement("div");

    block.className="ram-block";

    const center=
        (total-1)/2;

    const position=
        (i-center)/center;

    const spread=
        position*760;

    const distance=
        Math.abs(position);

    const depth=
        300-distance*130;

    const scale=
        1.12-distance*.30;

    block.style.left=
        `calc(50% + ${spread}px)`;

    block.style.transform=`
        translateX(-50%)
        translateZ(${depth}px)
        scale(${scale})
    `;

    block.style.opacity=
        .18+(1-distance)*.28;

    ramField.appendChild(block);
}

const red=
    document.getElementById("closeBtn");

const blue=
    document.getElementById("continueBtn");

let selected=1;

function selectButton(){

    red.style.filter=
        selected===0
        ?"brightness(1.3)"
        :"brightness(1)";

    blue.style.filter=
        selected===1
        ?"brightness(1.3)"
        :"brightness(1)";
}

function closePage(){

    document.body.style.transition=
        "opacity .5s";

    document.body.style.opacity="0";

    setTimeout(()=>{
        window.close();
    },500);
}

function continuePage(){

    window.location.href=TARGET;
}

red.addEventListener(
    "click",
    closePage
);

blue.addEventListener(
    "click",
    continuePage
);

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key==="ArrowRight"
        ){

            selected=
                selected===0
                ?1
                :0;

            selectButton();
        }

        if(
            e.key==="Enter" ||
            e.key==="x" ||
            e.key==="X"
        ){

            if(selected===0){
                closePage();
            }else{
                continuePage();
            }
        }

    }
);

let audioStarted=false;

function startAudio(){

    if(audioStarted)return;

    audioStarted=true;

    try{

        const AudioContext=
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx=
            new AudioContext();

        const now=
            ctx.currentTime;

        const notes=[
            [110,0,.25],
            [165,.12,.25],
            [220,.24,.3],
            [330,.40,.35],
            [440,.58,.45]
        ];

        notes.forEach(
            ([freq,start,duration])=>{

                const osc=
                    ctx.createOscillator();

                const gain=
                    ctx.createGain();

                osc.type="sine";

                osc.frequency.value=freq;

                gain.gain.setValueAtTime(
                    0,
                    now+start
                );

                gain.gain.linearRampToValueAtTime(
                    .07,
                    now+start+.03
                );

                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    now+start+duration
                );

                osc.connect(gain);

                gain.connect(
                    ctx.destination
                );

                osc.start(
                    now+start
                );

                osc.stop(
                    now+start+duration
                );

            }
        );

    }catch(e){}

}

document.addEventListener(
    "click",
    startAudio,
    {once:true}
);

document.addEventListener(
    "keydown",
    startAudio,
    {once:true}
);

setTimeout(()=>{

    const boot=
        document.getElementById("boot");

    boot.style.opacity="0";

    setTimeout(()=>{
        boot.style.display="none";
    },1000);

},2400);

if("getGamepads" in navigator){

    setInterval(()=>{

        const pads=
            navigator.getGamepads();

        if(!pads)return;

        const pad=
            [...pads].find(Boolean);

        if(!pad)return;

        if(
            pad.buttons[14] &&
            pad.buttons[14].pressed
        ){

            selected=0;
            selectButton();

        }

        if(
            pad.buttons[15] &&
            pad.buttons[15].pressed
        ){

            selected=1;
            selectButton();

        }

        if(
            pad.buttons[0] &&
            pad.buttons[0].pressed
        ){

            if(selected===0){
                closePage();
            }else{
                continuePage();
            }

        }

    },120);

}

selectButton();

</script>

</body>
</html>
