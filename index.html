<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PS4 WEBKIT LAUNCHER</title>
<style>
:root{
  --blue:#3fa9ff;
  --blue-dim:#1a4f7a;
  --red:#ff3b3b;
  --navy:#020610;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;
  background:var(--navy);
  overflow:hidden;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:#dbe9ff;
  -webkit-user-select:none;user-select:none;
  height:100%;
}
canvas#bg{
  position:fixed;inset:0;width:100%;height:100%;
  display:block;
}
#scanlines{
  position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,10,20,0.12) 3px 4px);
  mix-blend-mode:overlay;
  opacity:0.5;
}
#vignette{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,4,10,0.85) 100%);
}
#boot{
  position:fixed;inset:0;background:#000;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;transition:opacity 1.4s ease;
}
#boot .b1{font-size:2.6rem;letter-spacing:0.4em;font-weight:200;opacity:0;color:#8fd0ff;text-shadow:0 0 30px #3fa9ff;transition:opacity 1.2s ease;}
#boot .b2{font-size:1rem;letter-spacing:0.5em;opacity:0;color:#4a90c9;transition:opacity 1.2s ease;}
#boot .bar{width:220px;height:2px;background:#0a2540;overflow:hidden;opacity:0;transition:opacity 1s ease;position:relative;z-index:2;}
#boot .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#1a4f7a,#8fd0ff);transition:width 2.2s ease;}
#boot .b1,#boot .b2{position:relative;z-index:2;}
#bootGrid{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  perspective:900px;z-index:0;
}
#bootGridInner{
  display:grid;grid-template-columns:repeat(8,1fr);gap:8px;
  width:56vmin;height:56vmin;
  transform:rotateX(58deg) rotateZ(45deg);
  transform-style:preserve-3d;
  animation:gridSpin 6s linear infinite;
}
@keyframes gridSpin{from{transform:rotateX(58deg) rotateZ(45deg);}to{transform:rotateX(58deg) rotateZ(405deg);}}
.cube{
  opacity:0;transform:scale(0) rotate(90deg);
  background:linear-gradient(135deg,#8fd0ff,#0a2540 70%);
  box-shadow:0 0 14px rgba(63,169,255,0.55);
  animation:cubeIn 2.4s ease forwards;
}
@keyframes cubeIn{0%{opacity:0;transform:scale(0) rotate(140deg);}55%{opacity:1;}100%{opacity:0.9;transform:scale(1) rotate(0deg);}}
#boot.fading #bootGrid{transition:opacity .8s ease;opacity:0;}
#scene{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(3vh + env(safe-area-inset-top,0px)) 4vw calc(4vh + env(safe-area-inset-bottom,0px));
  opacity:0;transition:opacity 2s ease;
  text-align:center;
}
header{display:flex;flex-direction:column;align-items:center;gap:6px;}
.tag{font-size:0.65rem;letter-spacing:0.35em;color:#5c8fbf;font-weight:300;}
.logo{font-size:1.1rem;letter-spacing:0.3em;color:#8fd0ff;text-shadow:0 0 18px rgba(63,169,255,0.6);margin-top:4px;}
h1{
  font-size:clamp(1.8rem,5vw,3.2rem);
  font-weight:200;letter-spacing:0.12em;
  margin-top:10px;
  background:linear-gradient(180deg,#eaf6ff,#7fc4ff 70%,#2a70a8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(63,169,255,0.35);
}
.subtitle{font-size:0.85rem;letter-spacing:0.5em;color:#4a7fac;margin-top:6px;font-weight:300;}
.hands{
  position:relative;width:100%;max-width:1000px;
  display:flex;align-items:center;justify-content:space-between;
  flex:1;gap:4vw;
}
.hand{
  position:relative;flex:1;display:flex;align-items:center;justify-content:center;
}
.pill{
  position:relative;
  width:90%;max-width:280px;height:15vh;max-height:76px;min-height:52px;
  border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:clamp(0.85rem,1.8vw,1.2rem);letter-spacing:0.1em;
  white-space:nowrap;padding:0 6%;
  transition:transform .35s ease, box-shadow .35s ease, filter .35s ease;
  color:#fff;
}
.pill.red{
  background:linear-gradient(160deg,#ff8a8a,#c11f1f 60%,#6e0d0d);
  box-shadow:0 0 20px rgba(255,60,60,0.5), inset 0 2px 6px rgba(255,255,255,0.4);
}
.pill.blue{
  background:linear-gradient(160deg,#a9ddff,#1c7fd6 60%,#0a3c6e);
  box-shadow:0 0 20px rgba(63,169,255,0.5), inset 0 2px 6px rgba(255,255,255,0.4);
}
.hand.active .pill{transform:translateY(-8px) scale(1.08);}
.hand.active.left .pill{box-shadow:0 0 45px rgba(255,60,60,0.95), inset 0 2px 6px rgba(255,255,255,0.5);}
.hand.active.right .pill{box-shadow:0 0 45px rgba(63,169,255,0.95), inset 0 2px 6px rgba(255,255,255,0.5);}
.labels{display:flex;justify-content:space-between;width:100%;max-width:1100px;}
.label{width:38%;max-width:380px;font-size:0.7rem;letter-spacing:0.2em;color:#6fa3cf;line-height:1.8;}
.label b{display:block;font-size:0.95rem;letter-spacing:0.25em;color:#c9e6ff;}
.credit{
  font-size:0.6rem;letter-spacing:0.2em;color:#3f6488;
  margin-top:8px;opacity:0.8;
}
@media (prefers-color-scheme: light){:root{--navy:#020610;}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="boot">
  <div id="bootGrid"><div id="bootGridInner"></div></div>
  <div class="b1" id="bootLine1">PS4</div>
  <div class="b2" id="bootLine2">WEBKIT LAUNCHER</div>
  <div class="bar" id="bootBar"><i id="bootFill"></i></div>
</div>

<div id="scene">
  <header>
    <div class="tag">CREATED FOR THE COMMUNITY</div>
    <div class="logo">Raw13G</div>
    <h1>PS4 WEBKIT LAUNCHER</h1>
    <div class="subtitle">SELECT YOUR PATH</div>
  </header>

  <div class="hands">
    <div class="hand left" id="handClose">
      <div class="pill red" id="pillClose">NO JB 😢</div>
    </div>
    <div class="hand right" id="handContinue">
      <div class="pill blue" id="pillContinue">GOLDHEN JB</div>
    </div>
  </div>

  <div class="labels">
    <div class="label"><b>NO JB 😢</b>EXIT PAGE</div>
    <div class="label"><b>GOLDHEN JB</b>OPEN RAW13G</div>
  </div>
  <div class="credit">LAUNCHER AND INTERFACE CREATED BY NIXHOLAS</div>
</div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W,H,DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1,2);
  W = canvas.width = innerWidth*DPR;
  H = canvas.height = innerHeight*DPR;
  canvas.style.width = innerWidth+'px';
  canvas.style.height = innerHeight+'px';
}
resize();
addEventListener('resize', resize);

const blocks = [];
const cols = 14, rows = 9;
for(let i=0;i<cols;i++){
  for(let j=0;j<rows;j++){
    blocks.push({
      cx: i/(cols-1),
      depth: j/(rows-1),
      phase: Math.random()*Math.PI*2,
      speed: 0.4+Math.random()*0.6,
      baseH: 0.2+Math.random()*0.5
    });
  }
}
const particles = [];
for(let i=0;i<160;i++){
  particles.push({
    x:Math.random(), y:Math.random(),
    r:0.4+Math.random()*1.6,
    s:0.02+Math.random()*0.05,
    o:0.2+Math.random()*0.6
  });
}

let t=0;
function draw(){
  t+=0.016;
  ctx.clearRect(0,0,W,H);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#020a16');
  g.addColorStop(0.6,'#020610');
  g.addColorStop(1,'#000103');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let b=0;b<3;b++){
    const by = H*(0.2+b*0.22) + Math.sin(t*0.2+b)*10*DPR;
    const beam = ctx.createLinearGradient(0,by-40*DPR,0,by+40*DPR);
    beam.addColorStop(0,'rgba(63,169,255,0)');
    beam.addColorStop(0.5,'rgba(63,169,255,0.06)');
    beam.addColorStop(1,'rgba(63,169,255,0)');
    ctx.fillStyle=beam;
    ctx.fillRect(0,by-40*DPR,W,80*DPR);
  }

  const horizon = H*0.72;
  blocks.forEach(b=>{
    const persp = 0.35+b.depth*0.65;
    const x = W*(0.5 + (b.cx-0.5)*1.6*persp);
    const wdt = 46*persp*DPR;
    const hgt = (b.baseH + 0.25*Math.sin(t*b.speed+b.phase)) * 220*persp*DPR;
    const y = horizon - (1-b.depth)*40*DPR;
    const alpha = 0.12+0.22*persp;
    ctx.fillStyle = `rgba(70,150,220,${alpha})`;
    ctx.fillRect(x-wdt/2, y-hgt, wdt, hgt);
    ctx.fillStyle = `rgba(140,210,255,${alpha*0.9})`;
    ctx.fillRect(x-wdt/2, y-hgt, wdt, 4*DPR*persp+2);
    ctx.strokeStyle = `rgba(160,220,255,${alpha+0.15})`;
    ctx.lineWidth = 1*DPR;
    ctx.strokeRect(x-wdt/2, y-hgt, wdt, hgt);
  });

  particles.forEach(p=>{
    p.y -= p.s*0.01;
    if(p.y<0) p.y=1;
    const px = p.x*W, py = p.y*H;
    ctx.fillStyle = `rgba(150,210,255,${p.o*0.5})`;
    ctx.beginPath();
    ctx.arc(px,py,p.r*DPR,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

const bootEl = document.getElementById('boot');
const sceneEl = document.getElementById('scene');
const gridInner = document.getElementById('bootGridInner');
for(let i=0;i<64;i++){
  const c = document.createElement('div');
  c.className='cube';
  c.style.animationDelay = (Math.random()*1.6)+'s';
  gridInner.appendChild(c);
}
setTimeout(()=>{document.getElementById('bootLine1').style.opacity=1;},700);
setTimeout(()=>{document.getElementById('bootLine2').style.opacity=1;},1500);
setTimeout(()=>{
  const bar = document.getElementById('bootBar');
  bar.style.opacity=1;
  document.getElementById('bootFill').style.width='100%';
},2100);
setTimeout(()=>{
  bootEl.classList.add('fading');
},3900);
setTimeout(()=>{
  bootEl.style.opacity=0;
  sceneEl.style.opacity=1;
  bootEl.style.pointerEvents='none';
},4700);

let audioCtx;
function playBoot(){
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.type='sine';
    o1.frequency.setValueAtTime(80,now);
    o1.frequency.exponentialRampToValueAtTime(340,now+1.6);
    g1.gain.setValueAtTime(0.0001,now);
    g1.gain.exponentialRampToValueAtTime(0.25,now+0.6);
    g1.gain.exponentialRampToValueAtTime(0.0001,now+2.4);
    o1.connect(g1).connect(audioCtx.destination);
    o1.start(now);
    o1.stop(now+2.5);
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type='triangle';
    o2.frequency.setValueAtTime(680,now+0.3);
    g2.gain.setValueAtTime(0.0001,now+0.3);
    g2.gain.exponentialRampToValueAtTime(0.12,now+0.5);
    g2.gain.exponentialRampToValueAtTime(0.0001,now+1.6);
    o2.connect(g2).connect(audioCtx.destination);
    o2.start(now+0.3);
    o2.stop(now+1.8);
  }catch(e){}
}
document.addEventListener('pointerdown', playBoot, {once:true});
setTimeout(playBoot,420);

const handClose = document.getElementById('handClose');
const handContinue = document.getElementById('handContinue');
let selected = 'continue';

function setSelected(v){
  selected = v;
  handClose.classList.toggle('active', v==='close');
  handContinue.classList.toggle('active', v==='continue');
}
setSelected('continue');

function activate(){
  if(selected==='continue'){
    goContinue();
  }else{
    goClose();
  }
}

function goContinue(){
  document.body.style.transition='opacity .6s ease';
  document.body.style.opacity='0';
  setTimeout(()=>{ window.location.href='https://raw13g.github.io/'; },550);
}
function goClose(){
  try{
    window.close();
  }catch(e){}
  setTimeout(()=>{
    if(!window.closed){
      sceneEl.style.transition='opacity 1.2s ease';
      sceneEl.style.opacity='0';
      document.body.style.background='#000';
    }
  },300);
}

addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft') setSelected('close');
  if(e.key==='ArrowRight') setSelected('continue');
  if(e.key==='Enter' || e.key.toLowerCase()==='x') activate();
});

handClose.addEventListener('click',()=>{setSelected('close');goClose();});
handContinue.addEventListener('click',()=>{setSelected('continue');goContinue();});

let gpPoll=null;
addEventListener('gamepadconnected',()=>{
  if(gpPoll) return;
  gpPoll=setInterval(()=>{
    const gps = navigator.getGamepads?navigator.getGamepads():[];
    const gp = gps[0];
    if(!gp) return;
    const left = gp.axes[0] < -0.5 || gp.buttons[14]?.pressed;
    const right = gp.axes[0] > 0.5 || gp.buttons[15]?.pressed;
    if(left) setSelected('close');
    if(right) setSelected('continue');
    if(gp.buttons[0]?.pressed) activate();
  },120);
});

let mx=0,my=0;
addEventListener('pointermove',(e)=>{
  mx = (e.clientX/innerWidth-0.5);
  my = (e.clientY/innerHeight-0.5);
  sceneEl.style.transform = `translate(${mx*8}px, ${my*6}px)`;
});
</script>
</body>
</html>
