<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PS4 WEBKIT LAUNCHER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
width:100%;height:100%;overflow:hidden;
background:#02050a;color:#fff;
font-family:Arial,Helvetica,sans-serif;
}
body{display:flex;align-items:center;justify-content:center;user-select:none}
.launcher{
position:relative;width:100vw;height:100vh;
display:flex;align-items:center;justify-content:center;
overflow:hidden;
background:
radial-gradient(circle at 50% 40%,rgba(0,110,255,.16),transparent 38%),
radial-gradient(circle at 50% 100%,rgba(0,40,120,.18),transparent 50%),
#02050a;
}
.glow{
position:absolute;width:65vw;height:65vw;max-width:900px;max-height:900px;
border-radius:50%;
background:radial-gradient(circle,rgba(0,120,255,.10),transparent 68%);
filter:blur(20px);pointer-events:none;
}
.header{
position:absolute;top:7%;left:50%;
transform:translateX(-50%);
text-align:center;z-index:2;
}
.title{
font-size:clamp(24px,4vw,52px);
font-weight:800;letter-spacing:7px;
text-shadow:0 0 10px rgba(0,140,255,.8),0 0 30px rgba(0,100,255,.45);
}
.subtitle{
margin-top:8px;font-size:12px;letter-spacing:4px;opacity:.55;
}
.choices{
position:relative;z-index:3;
display:flex;align-items:center;justify-content:center;
gap:clamp(15px,3vw,45px);
width:90%;max-width:1100px;
}
.choice{
position:relative;width:clamp(170px,23vw,260px);height:100px;
display:flex;align-items:center;justify-content:center;
cursor:pointer;transition:.25s ease;opacity:.48;
}
.choice.selected{
transform:scale(1.12);opacity:1;
filter:drop-shadow(0 0 22px rgba(0,140,255,.5));
}
.pill{
width:100%;height:62px;border-radius:18px;
display:flex;align-items:center;justify-content:center;
font-size:clamp(12px,1.4vw,16px);
font-weight:800;letter-spacing:1.5px;
border:1px solid rgba(255,255,255,.15);
background:rgba(10,15,25,.82);
backdrop-filter:blur(12px);
box-shadow:inset 0 0 20px rgba(255,255,255,.025),0 8px 30px rgba(0,0,0,.35);
transition:.25s ease;
}
.choice.selected .pill{
box-shadow:
0 0 0 1px rgba(255,255,255,.15),
0 0 25px rgba(0,140,255,.35),
inset 0 0 25px rgba(0,120,255,.08);
}
.pill.red{color:#ff5c6c;border-color:rgba(255,70,90,.35)}
.pill.blue{color:#42a5ff;border-color:rgba(50,150,255,.4)}
.pill.store{
color:#c77dff;
border-color:rgba(175,80,255,.5);
box-shadow:inset 0 0 20px rgba(170,70,255,.06),0 0 18px rgba(150,60,255,.12);
}
.choice.selected .pill.store{
box-shadow:
0 0 0 1px rgba(210,150,255,.2),
0 0 30px rgba(170,70,255,.45),
inset 0 0 25px rgba(170,70,255,.1);
}
#padStatus{
position:absolute;top:18px;right:22px;z-index:20;
display:flex;align-items:center;gap:8px;
font-size:11px;letter-spacing:1px;opacity:.55;
}
.statusDot{
width:8px;height:8px;border-radius:50%;
background:#777;box-shadow:0 0 8px #777;
}
.statusDot.connected{
background:#3cff88;box-shadow:0 0 12px #3cff88;
}
.footer{
position:absolute;bottom:6%;left:50%;
transform:translateX(-50%);z-index:2;
display:flex;gap:22px;align-items:center;justify-content:center;
font-size:11px;letter-spacing:1.5px;opacity:.45;
white-space:nowrap;
}
.footer span{display:flex;align-items:center;gap:6px}
.buttonIcon{
width:18px;height:18px;border:1px solid rgba(255,255,255,.35);
border-radius:50%;display:inline-flex;
align-items:center;justify-content:center;font-size:10px;
}
#loading{
position:fixed;inset:0;z-index:100;
background:#02050a;display:flex;
flex-direction:column;align-items:center;justify-content:center;
opacity:0;pointer-events:none;transition:opacity .35s ease;
}
#loading.show{opacity:1;pointer-events:auto}
.loaderRing{
width:55px;height:55px;border-radius:50%;
border:3px solid rgba(255,255,255,.08);
border-top-color:#2698ff;
animation:spin .8s linear infinite;
box-shadow:0 0 25px rgba(0,130,255,.35);
}
.loadingText{
margin-top:18px;font-size:12px;letter-spacing:3px;opacity:.65;
}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{animation:flash .18s ease}
@keyframes flash{
0%{transform:scale(1.12)}
50%{transform:scale(1.18)}
100%{transform:scale(1.12)}
}
@media(max-width:700px){
.choices{flex-direction:column;gap:8px}
.choice{width:min(75vw,300px);height:75px}
.pill{height:52px}
.header{top:5%}
.footer{bottom:3%;gap:10px;font-size:9px}
}
</style>
</head>

<body>

<div class="launcher">

<div class="glow"></div>

<div class="header">
<div class="title">PS4 WEBKIT</div>
<div class="subtitle">LAUNCHER</div>
</div>

<div id="padStatus">
<div class="statusDot" id="statusDot"></div>
<span id="statusText">CONTROLLER NOT DETECTED</span>
</div>

<div class="choices">

<div class="choice selected" id="choiceClose">
<div class="pill red">NO JB 😢</div>
</div>

<div class="choice" id="choiceStore">
<div class="pill store">🛍 HOMEBREW STORE</div>
</div>

<div class="choice" id="choiceContinue">
<div class="pill blue">GOLDHEN JB</div>
</div>

</div>

<div class="footer">
<span>
<span class="buttonIcon">←</span>
<span class="buttonIcon">→</span>
</span>
<span>
<span class="buttonIcon">✕</span>
</span>
<span>
<span class="buttonIcon">○</span>
</span>
</div>

</div>

<div id="loading">
<div class="loaderRing"></div>
<div class="loadingText" id="loadingText"></div>
</div>

<script>

const URL_GO='https://raw13g.github.io/';
const URL_STORE='https://pkg-zone.com/';

const choiceClose=document.getElementById('choiceClose');
const choiceStore=document.getElementById('choiceStore');
const choiceContinue=document.getElementById('choiceContinue');
const loading=document.getElementById('loading');
const loadingText=document.getElementById('loadingText');
const statusDot=document.getElementById('statusDot');
const statusText=document.getElementById('statusText');

let selected='close';

function setSel(value){
selected=value;
choiceClose.classList.remove('selected');
choiceStore.classList.remove('selected');
choiceContinue.classList.remove('selected');

if(value==='close')choiceClose.classList.add('selected');
if(value==='store')choiceStore.classList.add('selected');
if(value==='continue')choiceContinue.classList.add('selected');
}

function previousSelection(){
if(selected==='close')setSel('continue');
else if(selected==='store')setSel('close');
else if(selected==='continue')setSel('store');
}

function nextSelection(){
if(selected==='close')setSel('store');
else if(selected==='store')setSel('continue');
else if(selected==='continue')setSel('close');
}

function showLoading(text){
loadingText.textContent=text||'';
loading.classList.add('show');
}

function closeLauncher(){
choiceClose.classList.add('flash');
setTimeout(()=>{
choiceClose.classList.remove('flash');
if(window.history.length>1)window.history.back();
},180);
}

function activate(){
choiceContinue.classList.add('flash');

setTimeout(()=>{
showLoading('');

setTimeout(()=>{
window.location.href=URL_GO;
},350);

},180);
}

function openHomebrewStore(){
choiceStore.classList.add('flash');

setTimeout(()=>{
showLoading('');

setTimeout(()=>{
window.location.href=URL_STORE;
},350);

},180);
}

choiceClose.addEventListener('pointerenter',()=>{
setSel('close');
});

choiceStore.addEventListener('pointerenter',()=>{
setSel('store');
});

choiceContinue.addEventListener('pointerenter',()=>{
setSel('continue');
});

choiceClose.addEventListener('click',closeLauncher);
choiceStore.addEventListener('click',openHomebrewStore);
choiceContinue.addEventListener('click',activate);

window.addEventListener('keydown',e=>{

if(e.key==='ArrowLeft'){
e.preventDefault();
previousSelection();
}

if(e.key==='ArrowRight'){
e.preventDefault();
nextSelection();
}

if(e.key==='Enter'||e.key===' '){

e.preventDefault();

if(selected==='close')closeLauncher();
else if(selected==='store')openHomebrewStore();
else if(selected==='continue')activate();

}

if(e.key==='Escape'){
e.preventDefault();
closeLauncher();
}

});

let activePad=null;

let lastPadState={
left:false,
right:false,
cross:false,
circle:false,
options:false,
share:false
};

window.addEventListener('gamepadconnected',e=>{
activePad=e.gamepad;
statusDot.classList.add('connected');
statusText.textContent='PS4 CONTROLLER CONNECTED';
});

window.addEventListener('gamepaddisconnected',e=>{

if(activePad&&e.gamepad.index===activePad.index){
activePad=null;
}

statusDot.classList.remove('connected');
statusText.textContent='CONTROLLER NOT DETECTED';

});

function buttonPressed(pad,index){
return !!(
pad.buttons&&
pad.buttons[index]&&
pad.buttons[index].pressed
);
}

function findController(){

const pads=navigator.getGamepads?navigator.getGamepads():[];

for(let i=0;i<pads.length;i++){

if(pads[i]){

activePad=pads[i];
statusDot.classList.add('connected');
statusText.textContent='PS4 CONTROLLER CONNECTED';

return pads[i];

}

}

return null;
}

function pollGamepad(){

const pad=activePad||findController();

if(pad){

const dpadLeft=buttonPressed(pad,14);
const dpadRight=buttonPressed(pad,15);

const axisX=
pad.axes&&pad.axes.length>=1?
pad.axes[0]:0;

const left=dpadLeft||axisX<-0.55;
const right=dpadRight||axisX>0.55;

const cross=buttonPressed(pad,0);
const circle=buttonPressed(pad,1);
const share=buttonPressed(pad,8);
const options=buttonPressed(pad,9);

if(left&&!lastPadState.left){
previousSelection();
}

if(right&&!lastPadState.right){
nextSelection();
}

if(cross&&!lastPadState.cross){

if(selected==='close')closeLauncher();
else if(selected==='store')openHomebrewStore();
else if(selected==='continue')activate();

}

if(circle&&!lastPadState.circle){
closeLauncher();
}

if(options&&!lastPadState.options){

if(document.documentElement.requestFullscreen){
document.documentElement.requestFullscreen().catch(()=>{});
}

}

if(share&&!lastPadState.share){

document.body.style.opacity='.65';

setTimeout(()=>{
document.body.style.opacity='1';
},120);

}

lastPadState.left=left;
lastPadState.right=right;
lastPadState.cross=cross;
lastPadState.circle=circle;
lastPadState.options=options;
lastPadState.share=share;

}

requestAnimationFrame(pollGamepad);
}

requestAnimationFrame(pollGamepad);

setSel('close');

window.addEventListener('contextmenu',e=>{
e.preventDefault();
});

let lastTouch=0;

document.addEventListener('touchend',e=>{

const now=Date.now();

if(now-lastTouch<350){
e.preventDefault();
}

lastTouch=now;

},{passive:false});

</script>

</body>
</html>
