<!DOCTYPE html>

<title>PS4 WebKit Launcher</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020711;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    user-select:none;
}

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,rgba(20,85,170,.35),transparent 35%),
        radial-gradient(circle at 50% 80%,rgba(0,60,150,.18),transparent 45%),
        linear-gradient(#020711,#01040b);
}

.bg:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.018) 0px,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 4px
        );
    opacity:.65;
    pointer-events:none;
}

.horizon{
    position:absolute;
    left:0;
    right:0;
    top:51%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(50,150,255,.15),
        rgba(80,180,255,.8),
        rgba(50,150,255,.15),
        transparent
    );
    box-shadow:0 0 25px rgba(30,130,255,.5);
}

.wave{
    position:absolute;
    left:-20%;
    width:140%;
    height:180px;
    border-radius:50%;
    border-top:1px solid rgba(40,130,255,.15);
    filter:blur(1px);
}

.wave:nth-child(1){
    top:37%;
    transform:rotate(-3deg);
}

.wave:nth-child(2){
    top:43%;
    transform:rotate(2deg);
    opacity:.7;
}

.wave:nth-child(3){
    top:58%;
    transform:rotate(-2deg);
    opacity:.45;
}

.wave:nth-child(4){
    top:67%;
    transform:rotate(3deg);
    opacity:.3;
}

.ram-field{
    position:absolute;
    left:50%;
    bottom:-20px;
    width:110%;
    height:58%;
    transform:translateX(-50%);
    perspective:900px;
    perspective-origin:50% 75%;
    transform-style:preserve-3d;
    pointer-events:none;
    overflow:hidden;
}

.ram-block{
    position:absolute;
    bottom:0;
    width:38px;
    min-height:70px;
    transform-style:preserve-3d;
    background:
        linear-gradient(
            90deg,
            rgba(30,120,255,.035),
            rgba(70,160,255,.12),
            rgba(30,90,220,.035)
        );
    border:1px solid rgba(70,160,255,.18);
    box-shadow:
        0 0 18px rgba(20,100,255,.06),
        inset 0 0 18px rgba(60,150,255,.05);
    backdrop-filter:blur(2px);
    transition:
        height .8s ease,
        transform .8s ease;
}

.ram-block:before{
    content:"";
    position:absolute;
    left:-1px;
    top:-1px;
    width:100%;
    height:14px;
    background:linear-gradient(
        135deg,
        rgba(120,200,255,.20),
        rgba(40,120,255,.08)
    );
    border:1px solid rgba(100,190,255,.22);
    transform-origin:top;
    transform:skewX(-38deg);
}

.ram-block:after{
    content:"";
    position:absolute;
    top:0;
    right:-14px;
    width:14px;
    height:100%;
    background:rgba(25,90,180,.06);
    border-right:1px solid rgba(70,150,255,.12);
    transform-origin:left;
    transform:skewY(-38deg);
}

.ram-block:nth-child(odd){
    filter:brightness(.8);
}

.ram-block:nth-child(3n){
    filter:brightness(1.2);
}

.ram-block.active{
    box-shadow:
        0 0 25px rgba(30,120,255,.14),
        inset 0 0 22px rgba(60,160,255,.10);
}

@keyframes ramFloat{
    0%,100%{
        margin-bottom:0;
    }
    50%{
        margin-bottom:5px;
    }
}

.ram-block{
    animation:ramFloat 4s ease-in-out infinite;
}

.ram-block:nth-child(2n){
    animation-delay:-1s;
}

.ram-block:nth-child(3n){
    animation-delay:-2s;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#65b8ff;
    box-shadow:0 0 8px #228cff;
    opacity:.5;
}

.p1{left:8%;top:26%}
.p2{left:23%;top:44%}
.p3{left:35%;top:20%}
.p4{left:68%;top:25%}
.p5{left:82%;top:41%}
.p6{left:91%;top:30%}
.p7{left:14%;top:70%}
.p8{left:74%;top:67%}
.p9{left:58%;top:18%}

.credit{
    position:absolute;
    top:13px;
    left:50%;
    transform:translateX(-50%);
    font-size:9px;
    letter-spacing:6px;

.creator{

.title{

.scene{

    left:50%;
    top:145px;
    width:600px;
    height:540px;
    transform:translateX(-50%);

}

.character{

    left:50%;
    top:0;
    width:270px;
    height:510px;
    transform:translateX(-50%);
}

.head{

    left:50%;
    top:0;
    width:105px;

    transform:translateX(-50%);
    border-radius:42% 42% 35% 35%;

        linear-gradient(

        );

.hair{
    position:absolute;
    left:50%;
    top:-5px;
    width:100px;
    height:45px;
    transform:translateX(-50%);
    background:#080b0f;
    clip-path:polygon(
        0 55%,

        50% 0,
        78% 8%,
        94% 25%,

        80% 45%,

.ear{

}

.ear.left{

}

.ear.right{

}

.glasses{

    left:50%;
    top:47px;
    width:92px;
    height:30px;

}

.glass{

    top:0;
    width:42px;
    height:25px;

.glass.left{

.glass.right{

.bridge{

.neck{

.hand{

.palm{

.thumb{

.hand.left .thumb{

<script>

const TARGET="https://raw13g.github.io/";

const ramField=document.querySelector(".ram-field");

if(ramField){

    ramField.innerHTML="";

    const total=31;

    for(let i=0;i<total;i++){

        const block=document.createElement("div");

        block.className="ram-block";

        const center=(total-1)/2;

        const distance=(i-center)/center;

        const spread=distance*720;

        const depth=Math.abs(distance);

        const baseHeight=
            80+
            Math.random()*180+
            (1-depth)*90;

        const tilt=distance*8;

        block.style.left=
            `calc(50% + ${spread}px)`;

        block.style.height=
            `${baseHeight}px`;

        block.style.transform=`
            translateX(-50%)
            translateZ(${-depth*160}px)
            rotateY(${tilt}deg)
            rotateX(8deg)
        `;

        block.style.opacity=
            String(.22+(1-depth)*.25);

        block.style.animationDelay=
            `${-Math.random()*4}s`;

        ramField.appendChild(block);
    }

    const blocks=[
        ...document.querySelectorAll(".ram-block")
    ];

    function updateRamBlocks(){

        const time=
            performance.now()/1000;

        blocks.forEach((block,i)=>{

            const center=
                (blocks.length-1)/2;

            const distance=
                (i-center)/center;

            const depth=
                Math.abs(distance);

            const wave=
                Math.sin(
                    time*.7+i*.45
                )*.5+.5;

            const base=
                90+
                (1-depth)*180;

            const height=
                base+
                wave*120+
                Math.random()*3;

            const spread=
                distance*720;

            const tilt=
                distance*8;

            block.style.height=
                `${height}px`;

            block.style.left=
                `calc(50% + ${spread}px)`;

            block.style.transform=`
                translateX(-50%)
                translateZ(${-depth*160}px)
                rotateY(${tilt}deg)
                rotateX(8deg)
            `;

            if(wave>.78){
                block.classList.add("active");
            }else{
                block.classList.remove("active");
            }

        });

    }

    setInterval(updateRamBlocks,900);
}

const red=document.getElementById("closeBtn");
const blue=document.getElementById("continueBtn");

let selected=1;

function selectButton(){

    red.classList.remove("selected");
    blue.classList.remove("selected");

    if(selected===0){
        red.classList.add("selected");
    }else{
        blue.classList.add("selected");
    }
}

function closePage(){

    document.body.style.transition=
        "opacity .5s";

    document.body.style.opacity="0";

    setTimeout(()=>{
        window.close();
    },500);
}

function continuePage(){

    window.location.href=TARGET;
}

red.addEventListener(
    "click",
    closePage
);

blue.addEventListener(
    "click",
    continuePage
);

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key==="ArrowRight"
        ){

            selected=
                selected===0
                ?1
                :0;

            selectButton();
        }

        if(
            e.key==="Enter" ||
            e.key==="x" ||
            e.key==="X"
        ){

            if(selected===0){
                closePage();
            }else{
                continuePage();
            }
        }

    }
);

let audioStarted=false;

function startAudio(){

    if(audioStarted)return;

    audioStarted=true;

    try{

        const AudioContext=
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx=
            new AudioContext();

        const now=
            ctx.currentTime;

        const notes=[
            [110,.00,.25],
            [165,.12,.25],
            [220,.24,.3],
            [330,.40,.35],
            [440,.58,.45]
        ];

        notes.forEach(
            ([freq,start,duration])=>{

                const osc=
                    ctx.createOscillator();

                const gain=
                    ctx.createGain();

                osc.type="sine";

                osc.frequency.value=freq;

                gain.gain.setValueAtTime(
                    0,
                    now+start
                );

                gain.gain.linearRampToValueAtTime(
                    .07,
                    now+start+.03
                );

                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    now+start+duration
                );

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now+start);
                osc.stop(now+start+duration);
            }
        );

    }catch(e){}

}

document.addEventListener(
    "click",
    startAudio,
    {once:true}
);

document.addEventListener(
    "keydown",
    startAudio,
    {once:true}
);

setTimeout(()=>{

    const boot=
        document.getElementById("boot");

    boot.style.opacity="0";

    setTimeout(()=>{
        boot.style.display="none";
    },1000);

},2400);

selectButton();

if("getGamepads" in navigator){

    setInterval(()=>{

        const pads=
            navigator.getGamepads();

        if(!pads)return;

        const pad=
            [...pads].find(Boolean);

        if(!pad)return;

        if(
            pad.buttons[14] &&
            pad.buttons[14].pressed
        ){

            selected=0;
            selectButton();
        }

        if(
            pad.buttons[15] &&
            pad.buttons[15].pressed
        ){

            selected=1;
            selectButton();
        }

        if(
            pad.buttons[0] &&
            pad.buttons[0].pressed
        ){

            if(selected===0){
                closePage();
            }else{
                continuePage();
            }

        }

    },120);

}
