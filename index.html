<style>

box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
background:var(--navy);
overflow:hidden;
font-family:'Segoe UI',system-ui,sans-serif;

-webkit-user-select:none;

#bg{
position:fixed;
inset:0;
width:100%;
height:100%;

opacity:0;
transition:opacity 2.5s ease;
}

}

#vignette{
position:fixed;
inset:0;
pointer-events:none;
z-index:4;

ellipse at center,
rgba(0,0,0,0) 45%,
rgba(0,2,10,.88) 100%
);
}

#flash{
position:fixed;
inset:0;
pointer-events:none;
z-index:70;
opacity:0;
transition:opacity .55s ease;

circle at center,
#fff 0%,
#9cc8ff 40%,
#1a2a66 100%
);

position:fixed;
inset:0;
background:#000;
z-index:100;
display:flex;

font-size:.9rem;

font-weight:300;

0%,100%{opacity:.25;}
50%{opacity:1;}

position:fixed;
inset:0;
z-index:50;
display:flex;
flex-direction:column;
align-items:center;

gap:18px;

display:block;

#scene{
position:fixed;
inset:0;

display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;
padding:
calc(3vh + env(safe-area-inset-top,0px))
4vw
calc(3vh + env(safe-area-inset-bottom,0px));
opacity:0;
transition:opacity 2s ease;
text-align:center;

pointer-events:auto;
}

header{
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
text-shadow:0 2px 14px #000;
}

.tag{
font-size:.65rem;
letter-spacing:.35em;
color:#7fa9d4;

.logo{

letter-spacing:.3em;
color:#a8dcff;

h1{
font-size:clamp(1.8rem,5vw,3.2rem);
font-weight:200;
letter-spacing:.12em;
margin-top:10px;
background:linear-gradient(
180deg,
#eaf6ff,
#7fc4ff 70%,
#2a70a8
);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
filter:
drop-shadow(0 0 22px rgba(63,169,255,.4))
drop-shadow(0 3px 10px #000);
}

.subtitle{
font-size:.85rem;
letter-spacing:.5em;
color:#6fa3cf;
margin-top:6px;
font-weight:300;
}

#snd{
position:absolute;
top:calc(2vh + env(safe-area-inset-top,0px));
right:3vw;
background:rgba(2,6,16,.5);
border:1px solid rgba(111,163,207,.35);
color:#7fb0dc;
font:inherit;
font-size:.6rem;
letter-spacing:.2em;
padding:6px 12px;
border-radius:999px;
cursor:pointer;
}

.choices{
position:relative;
width:100%;
max-width:1000px;
display:flex;
align-items:center;
justify-content:space-between;
flex:1;
gap:2vw;
}

.choice{
flex:1;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.pill{
position:relative;
width:82%;
max-width:250px;
height:12vh;
max-height:68px;
min-height:48px;
border-radius:999px;
display:flex;
align-items:center;
justify-content:center;
font-weight:600;
font-size:clamp(.75rem,1.6vw,1.05rem);
letter-spacing:.08em;
white-space:nowrap;
padding:0 5%;
color:#fff;
text-shadow:0 1px 4px rgba(0,0,0,.5);
transition:
transform .35s ease,
box-shadow .35s ease,
filter .35s ease;
}

.pill::after{
content:"";
position:absolute;
left:8%;
right:8%;
top:6%;
height:38%;
border-radius:999px;
background:linear-gradient(
180deg,
rgba(255,255,255,.45),
rgba(255,255,255,0)
);
pointer-events:none;
}

.pill.red{
background:linear-gradient(
160deg,
#ff8a8a,
#c11f1f 60%,
#6e0d0d
);
box-shadow:
0 0 20px rgba(255,60,60,.5),
inset 0 2px 6px rgba(255,255,255,.4);
}

.pill.blue{
background:linear-gradient(
160deg,
#a9ddff,
#1c7fd6 60%,
#0a3c6e
);
box-shadow:
0 0 20px rgba(63,169,255,.5),
inset 0 2px 6px rgba(255,255,255,.4);
}

.choice:not(.active) .pill{
filter:brightness(.72) saturate(.85);
}

.choice.active .pill{
transform:translateY(-8px) scale(1.08);
}

.choice.active.left .pill{
box-shadow:
0 0 50px rgba(255,60,60,.95),
inset 0 2px 6px rgba(255,255,255,.5);
}

.choice.active.center .pill,
.choice.active.right .pill{
box-shadow:
0 0 50px rgba(63,169,255,.95),
inset 0 2px 6px rgba(255,255,255,.5);
}

footer{
display:flex;
flex-direction:column;
align-items:center;
width:100%;
text-shadow:0 2px 10px #000;
}

.hint{
font-size:.6rem;
letter-spacing:.22em;
color:#5f8fb8;
margin-top:12px;
}

.hint b{
color:#a8d4f5;
font-weight:600;
}

.credit{
font-size:.6rem;
letter-spacing:.2em;
color:#4f79a0;
margin-top:8px;

</style>

<script>

const $=id=>document.getElementById(id);

const URL_GO='https://raw13g.github.io/';
const URL_STORE='https://pkg-zone.com/';

const RM=
matchMedia('(prefers-reduced-motion: reduce)').matches;


/* BACKGROUND */

const cv=$('bg');
const ctx=cv.getContext('2d');

let W,H,DPR;

function resize(){

DPR=Math.min(
devicePixelRatio||1,
1.5
);

W=cv.width=innerWidth*DPR;
H=cv.height=innerHeight*DPR;

cv.style.width=
innerWidth+'px';

cv.style.height=
innerHeight+'px';

}

resize();

addEventListener(
'resize',
resize
);


const nc=
document.createElement('canvas');

nc.width=nc.height=128;

const nctx=
nc.getContext('2d');

const nd=
nctx.createImageData(
128,
128
);

for(
let i=0;
i<nd.data.length;
i+=4
){

const v=
Math.random()*255;

nd.data[i]=v;
nd.data[i+1]=v;
nd.data[i+2]=v;
nd.data[i+3]=255;

}

nctx.putImageData(
nd,
0,
0
);

const grain=
ctx.createPattern(
nc,
'repeat'
);


const Z=48;

const boxes=[];

for(
let n=0;
n<170;
n++
){

let gx,gy;

do{

gx=
Math.round(
(Math.random()*2-1)*7
);

gy=
Math.round(
(Math.random()*2-1)*4
);

}while(
Math.abs(gx)<1 &&
Math.abs(gy)<1
);

const s=
1.5+
(Math.random()<.3?.6:0);

boxes.push({

x:
gx*2.4+
(Math.random()-.5)*.5,

y:
gy*2.4+
(Math.random()-.5)*.5,

z:
Math.random()*Z,

w:
s*(.8+Math.random()*.4),

h:
s*(.8+Math.random()*.4),

l:
Math.random()<.55
?1.4+Math.random()*1.6
:5+Math.random()*9

});

}


const dots=[

{
a:1,
r:.30,
s:.20,
c:'255,50,60'
},

{
a:3,
r:.42,
s:-.15,
c:'70,255,130'
},

{
a:5,
r:.50,
s:.10,
c:'255,60,80'
},

{
a:2,
r:.20,
s:-.30,
c:'150,120,255'
}

];


function tint(m){

return `rgb(
${(8+157*m)|0},
${(10+168*m)|0},
${(26+196*m)|0}
)`;

}


function poly(p,col,a){

ctx.globalAlpha=a;
ctx.fillStyle=col;

ctx.beginPath();

ctx.moveTo(
p[0][0],
p[0][1]
);

for(
let i=1;
i<p.length;
i++
){

ctx.lineTo(
p[i][0],
p[i][1]
);

}

ctx.closePath();
ctx.fill();

ctx.strokeStyle=
'rgba(0,0,14,.55)';

ctx.lineWidth=
Math.max(1,DPR);

ctx.stroke();

}


let last=performance.now();

let t=0;
let camZ=0;

let flow=3;
let flowT=3;

let mx=0;
let my=0;

let tx=0;
let ty=0;


function setFlow(v){

flowT=
v*(RM?.35:1);

}

setFlow(3);


function frame(now){

const dt=
Math.min(
.05,
(now-last)/1000
);

last=now;
t+=dt;

flow+=
(flowT-flow)*
Math.min(1,dt*1.6);

camZ+=flow*dt;

mx+=
(tx-mx)*
Math.min(1,dt*2);

my+=
(ty-my)*
Math.min(1,dt*2);


const cx=W/2;
const cy=H/2;

const f=
Math.min(W,H)*1.05;


const camX=
Math.sin(t*.27)*.7+
mx*1.4;

const camY=
Math.cos(t*.21)*.5+
my*.9;


const P=(x,y,z)=>[

cx+
x*f/z,

cy+
y*f/z

];


ctx.globalCompositeOperation=
'source-over';

ctx.globalAlpha=1;

ctx.fillStyle='#02030a';

ctx.fillRect(
0,
0,
W,
H
);


let g=
ctx.createRadialGradient(
cx,
cy,
0,
cx,
cy,
Math.max(W,H)*.55
);

g.addColorStop(
0,
'rgba(60,70,190,.55)'
);

g.addColorStop(
.4,
'rgba(30,35,110,.22)'
);

g.addColorStop(
1,
'rgba(0,0,0,0)'
);

ctx.fillStyle=g;

ctx.fillRect(
0,
0,
W,
H
);


const list=[];

for(const b of boxes){

list.push([

((b.z-camZ)%Z+Z)%Z+.5,

b

]);

}

list.sort(
(a,c)=>c[0]-a[0]
);


for(
const [d,b]
of list
){

const a=
Math.min(
1,
(d-.5)/1.6
)*
Math.min(
1,
(Z-d)/6
);

if(a<=.01)
continue;


const x0=
b.x-b.w/2-camX;

const x1=
x0+b.w;

const y0=
b.y-b.h/2-camY;

const y1=
y0+b.h;

const z0=d;
const z1=d+b.l;

const fog=
Math.pow(
Math.max(
0,
1-d/Z
),
1.2
);


if(y0>0){

poly(
[
P(x0,y0,z0),
P(x1,y0,z0),
P(x1,y0,z1),
P(x0,y0,z1)
],
tint(fog*.78),
a
);

}


if(y1<0){

poly(
[
P(x0,y1,z0),
P(x1,y1,z0),
P(x1,y1,z1),
P(x0,y1,z1)
],
tint(fog*.36),
a
);

}


if(x0>0){

poly(
[
P(x0,y0,z0),
P(x0,y1,z0),
P(x0,y1,z1),
P(x0,y0,z1)
],
tint(fog*.55),
a
);

}


if(x1<0){

poly(
[
P(x1,y0,z0),
P(x1,y1,z0),
P(x1,y1,z1),
P(x1,y0,z1)
],
tint(fog*.55),
a
);

}


poly(
[
P(x0,y0,z0),
P(x1,y0,z0),
P(x1,y1,z0),
P(x0,y1,z0)
],
tint(fog),
a
);

}


ctx.globalAlpha=1;

ctx.globalCompositeOperation=
'lighter';


g=
ctx.createRadialGradient(
cx,
cy,
0,
cx,
cy,
Math.min(W,H)*.35
);

g.addColorStop(
0,
'rgba(70,80,200,.28)'
);

g.addColorStop(
1,
'rgba(0,0,0,0)'
);

ctx.fillStyle=g;

ctx.fillRect(
0,
0,
W,
H
);


for(const d of dots){

d.a+=d.s*dt;

const px=
cx+
Math.cos(d.a)*
d.r*W*.5;

const py=
cy+
Math.sin(d.a*1.3)*
d.r*H*.6;


ctx.shadowBlur=
16*DPR;

ctx.shadowColor=
`rgba(${d.c},1)`;

ctx.fillStyle=
`rgba(${d.c},.95)`;

ctx.beginPath();

ctx.arc(
px,
py,
2.2*DPR,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;

}


ctx.globalCompositeOperation=
'overlay';

ctx.globalAlpha=.22;

ctx.save();

ctx.translate(
-(Math.random()*128|0),
-(Math.random()*128|0)
);

ctx.fillStyle=grain;

ctx.fillRect(
0,
0,
W+128,
H+128
);

ctx.restore();

ctx.globalCompositeOperation=
'source-over';

ctx.globalAlpha=1;

requestAnimationFrame(frame);

}

requestAnimationFrame(frame);


/* AUDIO */

let ac=null;
let master=null;
let muted=false;
let droneOn=false;


function ensureAudio(){

try{

if(!ac){

ac=
new(
window.AudioContext||
window.webkitAudioContext
)();

master=
ac.createGain();

master.gain.value=
muted?0:1;

master.connect(
ac.destination
);

}

if(ac.state==='suspended')
ac.resume();

}catch(e){}

}


function tone(
type,
f0,
f1,
t0,
dur,
vol
){

if(!ac)return;

const o=
ac.createOscillator();

const g=
ac.createGain();

o.type=type;

o.frequency.setValueAtTime(
f0,
t0
);

if(f1!==f0){

o.frequency
.exponentialRampToValueAtTime(
f1,
t0+dur
);

}

g.gain.setValueAtTime(
.0001,
t0
);

g.gain.exponentialRampToValueAtTime(
vol,
t0+dur*.25
);

g.gain.exponentialRampToValueAtTime(
.0001,
t0+dur
);

o.connect(g).connect(master);

o.start(t0);

o.stop(
t0+dur+.05
);

}


function bootSound(){

if(!ac)return;

const n=
ac.currentTime;

tone(
'sine',
70,
320,
n,
2.4,
.28
);

tone(
'triangle',
520,
680,
n+.3,
1.3,
.12
);

tone(
'sine',
880,
1320,
n+1.1,
1.6,
.07
);

tone(
'sine',
1320,
1320,
n+1.5,
1.4,
.05
);

}


function blip(){

if(ac){

tone(
'square',
660,
880,
ac.currentTime,
.09,
.05
);

}

}


function confirmSnd(){

if(!ac)return;

const n=
ac.currentTime;

tone(
'triangle',
440,
880,
n,
.25,
.12
);

tone(
'sine',
880,
1760,
n+.08,
.3,
.08
);

}


function drone(){

if(!ac||droneOn)
return;

droneOn=true;

const g=
ac.createGain();

g.gain.value=0;

g.gain.linearRampToValueAtTime(
.05,
ac.currentTime+3
);

g.connect(master);


[55,55.7,110.4].forEach(
(fr,i)=>{

const o=
ac.createOscillator();

o.type=
i===2
?'triangle'
:'sine';

o.frequency.value=fr;

const q=
ac.createGain();

q.gain.value=
i===2?.3:1;

o.connect(q).connect(g);

o.start();

}
);

}


function toggleMute(){

muted=!muted;

if(master){

master.gain.setTargetAtTime(
muted?0:1,
ac.currentTime,
.05
);

}

$('snd').textContent=
muted
?'SOUND OFF'
:'SOUND ON';

}


/* EXPERIENCE */

const bootEl=$('boot');
const sceneEl=$('scene');
const gate=$('startGate');

const choiceClose=
$('choiceClose');

const choiceContinue=
$('choiceContinue');

const choiceStore=
$('choiceStore');


let started=false;
let ready=false;
let busy=false;

let selected='continue';

const timers=[];


function startExperience(){

if(started)return;

started=true;

ensureAudio();

bootSound();

gate.style.pointerEvents=
'none';

gate.style.opacity='0';

setTimeout(
()=>{
gate.style.display='none';
},
450
);

cv.classList.add('on');

setFlow(14);


timers.push(
setTimeout(
()=>{
$('bootLine1')
.style.opacity=1;
},
600
)
);


timers.push(
setTimeout(
()=>{
$('bootLine2')
.style.opacity=1;
},
1300
)
);


timers.push(
setTimeout(
()=>{
$('bootBar')
.style.opacity=1;

$('bootFill')
.style.width='100%';
},
1900
)
);


timers.push(
setTimeout(
finishBoot,
4400
)
);

}


function finishBoot(){

if(ready)return;

ready=true;

timers.forEach(
clearTimeout
);

bootEl.style.opacity=0;

bootEl.style.pointerEvents=
'none';

sceneEl.style.opacity=1;

sceneEl.classList.add('on');

setFlow(1.3);

drone();

}


/* CONTROLLER */

let lastGamepad=null;

function rumble(
duration=30,
strong=.25
){

try{

if(!lastGamepad)
return;

const actuator=
lastGamepad.vibrationActuator;

if(
actuator &&
actuator.playEffect
){

actuator.playEffect(
'dual-rumble',
{
duration:duration,
startDelay:0,
strongMagnitude:strong,
weakMagnitude:strong*.5
}
).catch(
()=>{}
);

}

}catch(e){}

}


/* SELECTION */

function setSel(v){

if(busy||!ready)
return;

if(selected!==v){

blip();

rumble(
20,
.18
);

}

selected=v;

choiceClose.classList.toggle(
'active',
v==='close'
);

choiceContinue.classList.toggle(
'active',
v==='continue'
);

choiceStore.classList.toggle(
'active',
v==='store'
);

}


choiceClose.classList.remove(
'active'
);

choiceContinue.classList.add(
'active'
);

choiceStore.classList.remove(
'active'
);


/* ACTIVATE */

function activate(){

if(busy||!ready)
return;

busy=true;

confirmSnd();

rumble(
90,
.45
);


if(selected==='continue'){

$('flash')
.classList.add('on');

setFlow(70);

setTimeout(
()=>{
window.location.href=
URL_GO;
},
700
);

}


else if(selected==='store'){

$('flash')
.classList.add('on');

setFlow(70);

setTimeout(
()=>{
window.location.href=
URL_STORE;
},
700
);

}


else{

try{
window.close();
}catch(e){}


setTimeout(
()=>{

sceneEl.style.transition=
'opacity 1.2s ease';

sceneEl.style.opacity=0;

cv.style.transition=
'opacity 1.6s ease';

cv.style.opacity=0;

document.body.style.background=
'#000';

},
300
);

}

}


/* FULLSCREEN */

function goFull(){

const el=
document.documentElement;

if(
document.fullscreenElement
){

if(
document.exitFullscreen
){

document
.exitFullscreen()
.catch(
()=>{}
);

}

}

else if(
el.requestFullscreen
){

el.requestFullscreen()
.catch(
()=>{}
);

}

}


/* START */

gate.addEventListener(
'click',
startExperience
);


bootEl.addEventListener(
'click',
()=>{
if(
started &&
!ready
)
finishBoot();
}
);


/* POINTER */

choiceClose.addEventListener(
'pointerenter',
()=>{
setSel('close');
}
);

choiceContinue.addEventListener(
'pointerenter',
()=>{
setSel('continue');
}
);

choiceStore.addEventListener(
'pointerenter',
()=>{
setSel('store');
}
);


/* CLICK */

choiceClose.addEventListener(
'click',
()=>{
setSel('close');
activate();
}
);

choiceContinue.addEventListener(
'click',
()=>{
setSel('continue');
activate();
}
);

choiceStore.addEventListener(
'click',
()=>{
setSel('store');
activate();
}
);


/* SOUND */

$('snd').addEventListener(
'click',
e=>{
e.stopPropagation();
ensureAudio();
toggleMute();
}
);


/* KEYBOARD */

addEventListener(
'keydown',
e=>{

if(!started){

startExperience();

return;

}

if(!ready){

finishBoot();

return;

}

if(e.key==='ArrowLeft'){

e.preventDefault();

if(selected==='store')
setSel('continue');

else if(selected==='continue')
setSel('close');

else
setSel('store');

}

else if(e.key==='ArrowRight'){

e.preventDefault();

if(selected==='close')
setSel('continue');

else if(selected==='continue')
setSel('store');

else
setSel('close');

}

else if(
e.key==='Enter'||
e.key===' '
){

e.preventDefault();

activate();

}

}
);


/* POINTER CAMERA */

addEventListener(
'pointermove',
e=>{

tx=
e.clientX/
innerWidth-
.5;

ty=
e.clientY/
innerHeight-
.5;

sceneEl.style.transform=
`translate(
${tx*8}px,
${ty*6}px
)`;

}
);


/* PS4 GAMEPAD */

const pp={

left:false,
right:false,
up:false,
down:false,

cross:false,
circle:false,
square:false,
triangle:false,

l1:false,
r1:false,

l2:false,
r2:false,

l3:false,
r3:false,

share:false,
options:false,
touch:false,

any:false

};


function edge(now,old){

return now&&!old;

}


setInterval(
()=>{

const pads=
navigator.getGamepads
?[...navigator.getGamepads()]
:[];

const gp=
pads.find(Boolean);

if(!gp)
return;

lastGamepad=gp;


/* STICKS */

const x=
gp.axes[0]||0;

const y=
gp.axes[1]||0;


const left=
x<-.55 ||
!!(
gp.buttons[14]&&
gp.buttons[14].pressed
);

const right=
x>.55 ||
!!(
gp.buttons[15]&&
gp.buttons[15].pressed
);

const up=
y<-.55 ||
!!(
gp.buttons[12]&&
gp.buttons[12].pressed
);

const down=
y>.55 ||
!!(
gp.buttons[13]&&
gp.buttons[13].pressed
);


/* FACE */

const cross=
!!(
gp.buttons[0]&&
gp.buttons[0].pressed
);

const circle=
!!(
gp.buttons[1]&&
gp.buttons[1].pressed
);

const square=
!!(
gp.buttons[2]&&
gp.buttons[2].pressed
);

const triangle=
!!(
gp.buttons[3]&&
gp.buttons[3].pressed
);


/* SHOULDERS */

const l1=
!!(
gp.buttons[4]&&
gp.buttons[4].pressed
);

const r1=
!!(
gp.buttons[5]&&
gp.buttons[5].pressed
);


/* TRIGGERS */

const l2=
!!(
gp.buttons[6]&&
gp.buttons[6].pressed
);

const r2=
!!(
gp.buttons[7]&&
gp.buttons[7].pressed
);


/* SPECIAL */

const share=
!!(
gp.buttons[8]&&
gp.buttons[8].pressed
);

const options=
!!(
gp.buttons[9]&&
gp.buttons[9].pressed
);

const l3=
!!(
gp.buttons[10]&&
gp.buttons[10].pressed
);

const r3=
!!(
gp.buttons[11]&&
gp.buttons[11].pressed
);


/* TOUCHPAD */

const touch=
!!(
gp.buttons[17]&&
gp.buttons[17].pressed
);


const any=
gp.buttons.some(
b=>b.pressed
)||
Math.abs(x)>.55||
Math.abs(y)>.55;


/* START */

if(
any &&
!pp.any
){

if(!started){

startExperience();

rumble(
50,
.2
);

}

else if(!ready){

finishBoot();

rumble(
50,
.2
);

}

}


/* NAVIGATION */

if(ready&&!busy){

if(
edge(left,pp.left)
){

if(selected==='store')
setSel('continue');

else if(selected==='continue')
setSel('close');

else
setSel('store');

}


if(
edge(right,pp.right)
){

if(selected==='close')
setSel('continue');

else if(selected==='continue')
setSel('store');

else
setSel('close');

}


if(
edge(up,pp.up)
){

setSel('continue');

}


if(
edge(down,pp.down)
){

setSel('continue');

}


/* L1 / R1 */

if(
edge(l1,pp.l1)
){

if(selected==='store')
setSel('continue');

else if(selected==='continue')
setSel('close');

else
setSel('store');

}


if(
edge(r1,pp.r1)
){

if(selected==='close')
setSel('continue');

else if(selected==='continue')
setSel('store');

else
setSel('close');

}


/* L2 / R2 */

if(
edge(l2,pp.l2)
){

if(selected==='store')
setSel('continue');

else if(selected==='continue')
setSel('close');

else
setSel('store');

}


if(
edge(r2,pp.r2)
){

if(selected==='close')
setSel('continue');

else if(selected==='continue')
setSel('store');

else
setSel('close');

}


/* X */

if(
edge(cross,pp.cross)
){

activate();

}


/* TOUCHPAD */

if(
edge(touch,pp.touch)
){

activate();

}


/* CIRCLE */

if(
edge(circle,pp.circle)
){

setSel('continue');

}


/* SQUARE */

if(
edge(square,pp.square)
){

setSel('continue');

}


/* TRIANGLE */

if(
edge(triangle,pp.triangle)
){

setSel('store');

}


/* OPTIONS */

if(
edge(options,pp.options)
){

ensureAudio();

toggleMute();

rumble(
35,
.2
);

}


/* SHARE */

if(
edge(share,pp.share)
){

goFull();

rumble(
35,
.2
);

}


/* L3 */

if(
edge(l3,pp.l3)
){

goFull();

rumble(
35,
.2
);

}


/* R3 */

if(
edge(r3,pp.r3)
){

ensureAudio();

toggleMute();

rumble(
35,
.2
);

}

}


/* SAVE */

pp.left=left;
pp.right=right;
pp.up=up;
pp.down=down;

pp.cross=cross;
pp.circle=circle;
pp.square=square;
pp.triangle=triangle;

pp.l1=l1;
pp.r1=r1;

pp.l2=l2;
pp.r2=r2;

pp.l3=l3;
pp.r3=r3;

pp.share=share;
pp.options=options;
pp.touch=touch;

pp.any=any;

},
80
);

</script>

</body>
</html>
