<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>PS4 WebKit Launcher</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
user-select:none;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:#01040b;
color:white;
}

body{

background:
radial-gradient(
ellipse at 50% 42%,
#123866 0%,
#091d38 24%,
#030b18 55%,
#000207 100%
);

}

/* BACKGROUND */

.background{
position:fixed;
inset:0;
overflow:hidden;
}

.wave{
position:absolute;
height:160%;
width:16vw;
top:-30%;

background:
linear-gradient(
90deg,
transparent,
rgba(50,120,230,.08),
rgba(130,180,255,.035),
rgba(20,80,170,.08),
transparent
);

filter:blur(8px);

transform:rotate(18deg);

animation:waveMove 13s ease-in-out infinite;
}

.wave:nth-child(1){
left:-5%;
animation-delay:-3s;
}

.wave:nth-child(2){
left:20%;
animation-delay:-8s;
}

.wave:nth-child(3){
left:48%;
animation-delay:-5s;
}

.wave:nth-child(4){
left:75%;
animation-delay:-10s;
}

@keyframes waveMove{

0%{
transform:translateX(-100px) rotate(18deg);
}

50%{
transform:translateX(120px) rotate(18deg);
}

100%{
transform:translateX(-100px) rotate(18deg);
}

}

/* PARTICLES */

.particle{
position:absolute;
width:2px;
height:2px;

background:#79baff;

border-radius:50%;

opacity:.5;

animation:particleMove linear infinite;
}

@keyframes particleMove{

0%{
transform:translateY(110vh) translateX(0);
opacity:0;
}

20%{
opacity:.7;
}

80%{
opacity:.7;
}

100%{
transform:translateY(-20vh) translateX(80px);
opacity:0;
}

}

/* PS2 STYLE HORIZONTAL LIGHT */

.light{
position:absolute;

width:120%;
height:2px;

left:-10%;
top:48%;

background:
linear-gradient(
90deg,
transparent,
rgba(80,150,255,.15),
rgba(180,220,255,.5),
rgba(80,150,255,.15),
transparent
);

filter:blur(2px);

animation:lightMove 8s ease-in-out infinite;
}

@keyframes lightMove{

0%,100%{
opacity:.2;
transform:scaleX(.7);
}

50%{
opacity:.8;
transform:scaleX(1);
}

}

/* TOP */

.credit{
position:absolute;

top:22px;
left:0;
right:0;

text-align:center;

z-index:50;

0 0 8px #438dff;

0 0 8px #308bff,

left:0;
right:0;

text-align:center;

font-size:10px;

letter-spacing:5px;

color:rgba(255,255,255,.42);

z-index:30;
}

/* CHARACTER AREA */

.character{
position:absolute;

left:50%;
top:51%;

transform:
translate(-50%,-50%);

width:min(780px,95vw);

height:520px;

z-index:10;
}

/* HEAD */

.head{
position:absolute;

left:50%;
top:20px;

transform:translateX(-50%);

width:115px;
height:145px;

background:
linear-gradient(
90deg,
#17191d,

48% 48% 45% 45%;

background:#292a2d;

.ear.left{
left:-12px;
}

.ear.right{
right:-12px;

/* NECK */

top:145px;

height:300px;

background:

.chain{

top:230px;

width:30px;
height:80px;

/* ARMS */

height:240px;

#101113,
#292b2e,

.arm.left{
left:155px;
transform:rotate(32deg);
}

.arm.right{
right:155px;
transform:rotate(-32deg);
}

/* FOREARMS */

.forearm{

top:340px;

width:65px;
height:130px;

linear-gradient(
90deg,
#131416,
#303236,
#111214
);

border-radius:35px;
}

.forearm.left{
left:125px;

transform:rotate(55deg);
}

.forearm.right{
right:125px;

transform:rotate(-55deg);

/* HANDS */

.hand{
position:absolute;

width:130px;
height:105px;

.hand.left{

.hand.right{

/* PALM */

.palm{

top:25px;

#c77c4d,

45% 50% 45% 40%;

inset -8px -8px 10px rgba(0,0,0,.3),

/* FINGERS */

.finger{

width:23px;
height:65px;

background:
linear-gradient(
90deg,
#9d5835,
#d18855,
#8e492c
);

border-radius:14px;

transform-origin:bottom;

box-shadow:
inset -4px -4px 5px rgba(0,0,0,.25);
}

.f1{
left:20px;
top:5px;
transform:rotate(-25deg);
}

.f2{
left:43px;
top:0;
transform:rotate(-10deg);
}

.f3{
left:66px;
top:2px;
transform:rotate(8deg);
}

.f4{

top:10px;

/* THUMB */

.thumb{
position:absolute;

left:0;
top:45px;

width:42px;
height:65px;

background:
linear-gradient(
90deg,
#8f4a2d,
#d18451
);

border-radius:25px;

transform:rotate(-45deg);

z-index:30;
}

/* PILLS */

.pill{
position:absolute;

left:50%;

top:43px;

transform:translateX(-50%);

width:88px;
height:42px;

border-radius:50%;

z-index:15;

border:2px solid rgba(255,255,255,.35);

display:flex;

align-items:center;
justify-content:center;

font-size:9px;

font-weight:bold;

letter-spacing:1px;

box-shadow:
inset 0 5px 8px rgba(255,255,255,.3),
inset 0 -7px 10px rgba(0,0,0,.5),
0 8px 15px #000;

transition:.3s;
}

.red{
background:
linear-gradient(
180deg,
#ff4b4b,
#970000

box-shadow:
0 0 20px rgba(255,0,0,.4),

inset 0 -7px 10px rgba(0,0,0,.5);
}

.blue{

linear-gradient(
180deg,
#48aaff,
#00429e

box-shadow:
0 0 20px rgba(0,120,255,.5),
inset 0 5px 8px rgba(255,255,255,.3),
inset 0 -7px 10px rgba(0,0,0,.5);
}

/* PILL LABELS */

.option{
position:absolute;

top:455px;

width:230px;

text-align:center;

font-size:17px;

font-weight:bold;

letter-spacing:4px;

text-shadow:
0 0 8px currentColor;
}

.option.left{
left:40px;
color:#ff3333;
}

.option.right{
right:40px;
color:#399cff;
}

.description{
position:absolute;

top:483px;

width:230px;

text-align:center;

font-size:9px;

letter-spacing:2px;

color:rgba(255,255,255,.45);
}

.description.left{

}

.description.right{

}

/* BOTTOM */

.controls{
position:absolute;

bottom:32px;

left:0;
right:0;

text-align:center;

font-size:10px;

letter-spacing:3px;

color:rgba(255,255,255,.4);

z-index:40;
}

/* CRT */

.crt{
position:fixed;

inset:0;

pointer-events:none;

z-index:100;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.018),
rgba(255,255,255,.018) 1px,
transparent 1px,
transparent 4px
);

}

/* VIGNETTE */

.vignette{
position:fixed;

inset:0;

pointer-events:none;

z-index:90;

background:
radial-gradient(
ellipse at center,
transparent 40%,
rgba(0,0,0,.65) 100%

}

/* BOOT */

.boot{
position:fixed;

z-index:200;

radial-gradient(
circle,
#092452,

transition:opacity 1s;
}

.boot-logo{

letter-spacing:12px;

0 0 12px #3c9cff,

.boot-text{

}

.loading-bar{
height:100%;
width:0;

background:white;

box-shadow:0 0 12px #5ca5ff;

animation:load 2.5s forwards;
}

@keyframes load{
to{width:100%}
}

.fade{
opacity:0;

transition:opacity .8s;
}

</style>

<script>

const TARGET="https://raw13g.github.io/";

let audioStarted=false;

function startupSound(){

if(audioStarted)return;

audioStarted=true;

try{

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

if(!AudioContext)return;

const ctx=new AudioContext();

const notes=[
[130.81,0,.45],
[196,.35,.45],
[261.63,.70,.45],
[329.63,1.05,.65]
];

notes.forEach(n=>{

const osc=ctx.createOscillator();

const gain=ctx.createGain();

osc.type="sine";

osc.frequency.value=n[0];

osc.connect(gain);

gain.connect(ctx.destination);

const start=ctx.currentTime+n[1];

const end=start+n[2];

gain.gain.setValueAtTime(
.0001,
start
);

gain.gain.exponentialRampToValueAtTime(
.18,
start+.03
);

gain.gain.exponentialRampToValueAtTime(
.0001,
end
);

osc.start(start);

osc.stop(end);

});

}catch(e){}

}


window.addEventListener("load",()=>{

setTimeout(()=>{

const boot=document.getElementById("boot");

boot.style.opacity="0";

setTimeout(()=>{

boot.style.display="none";

},1000);

},2600);

});


document.addEventListener(
"click",
startupSound,
{once:true}
);

document.addEventListener(
"keydown",
startupSound,
{once:true}
);


function redPill(){

document.body.classList.add("fade");

setTimeout(()=>{

window.close();

setTimeout(()=>{

document.body.classList.remove("fade");

alert(
"The browser blocked automatic closing of this page."
);

},900);

},500);

}


function bluePill(){

document.body.classList.add("fade");

setTimeout(()=>{

window.location.href=TARGET;

},500);

}


document.addEventListener("keydown",event=>{

if(event.key==="ArrowLeft"){

document.querySelector(".red").style.transform=
"translateX(-50%) scale(1.15)";

document.querySelector(".blue").style.transform=
"translateX(-50%) scale(1)";

}

if(event.key==="ArrowRight"){

document.querySelector(".blue").style.transform=
"translateX(-50%) scale(1.15)";

document.querySelector(".red").style.transform=
"translateX(-50%) scale(1)";

}

if(event.key==="Enter" || event.key.toLowerCase()==="x"){

const blue=
document.querySelector(".blue");

const selected=
getComputedStyle(blue).transform;

if(selected.includes("1.15")){

bluePill();

}else{

redPill();

}

}

});


document.querySelector(".red").onclick=redPill;

document.querySelector(".blue").onclick=bluePill;

</script>
